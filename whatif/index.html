<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" href="data:,">
<title>What If? - 8 Billion People</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#f4f1ea; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; color:#251f21; }
  #c { position:fixed; inset:0; display:block; touch-action:none; }
  .card { position:fixed; background:rgba(255,255,255,.88); backdrop-filter:blur(8px); border:1px solid rgba(37,31,33,.09); border-radius:14px; box-shadow:0 4px 24px rgba(37,31,33,.06); }
  #title { top:14px; left:14px; padding:10px 14px; max-width:min(430px,86vw); }
  #title b { font-size:15px; letter-spacing:.04em; }
  #title span { display:block; font-size:11.5px; color:#585254; margin-top:2px; }
  #hud { top:14px; right:14px; padding:10px 14px; display:flex; gap:16px; }
  #hud .r { text-align:right; }
  #hud label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8a8385; }
  #hud b { font-size:15px; font-variant-numeric:tabular-nums; }
  #dbwrap { left:14px; bottom:14px; padding:10px 14px; width:min(300px,60vw); }
  #dbwrap label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#8a8385; }
  #dbbar { height:6px; border-radius:3px; background:#eae9ea; margin:6px 0 4px; overflow:hidden; }
  #dbfill { height:100%; width:0%; background:#73a89a; transition:width .12s linear; }
  #dbfill.hot { background:#ed313e; }
  #dbval { font-size:12px; color:#585254; }
  #center { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #count { font-size:min(20vw,140px); font-weight:800; color:#251f21; opacity:0; transition:opacity .15s; text-shadow:0 2px 30px rgba(255,255,255,.8); text-align:center; }
  #panel { right:14px; bottom:14px; padding:12px 14px; width:min(320px,86vw); max-height:52vh; overflow:auto; }
  #panel h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8a8385; font-weight:600; }
  .btn { display:inline-block; border:1px solid rgba(37,31,33,.16); background:#fff; color:#251f21; border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer; margin:3px 4px 3px 0; }
  .btn:hover { border-color:#c76b1d; }
  .btn.primary { background:#c76b1d; border-color:#c76b1d; color:#fff; font-weight:600; }
  .btn.on { background:#251f21; color:#fff; border-color:#251f21; }
  .row { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:12.5px; color:#585254; }
  .row input[type=range] { flex:1; accent-color:#c76b1d; }
  .note { font-size:11.5px; color:#8a8385; line-height:1.45; margin-top:8px; }
  #results { display:none; left:50%; top:50%; transform:translate(-50%,-50%); padding:18px 20px; width:min(430px,90vw); max-height:80vh; overflow:auto; }
  #results h2 { margin:0 0 4px; font-size:17px; }
  #results .sub { font-size:12px; color:#8a8385; margin-bottom:10px; }
  #results table { width:100%; border-collapse:collapse; font-size:13px; }
  #results td { padding:6px 0; border-bottom:1px solid #eae9ea; }
  #results td:last-child { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  #povbar { left:50%; bottom:14px; transform:translateX(-50%); padding:8px 10px; }
  #qbadge { left:50%; top:14px; transform:translateX(-50%); padding:6px 12px; font-size:11px; color:#585254; display:none; }
  #stick { position:fixed; width:110px; height:110px; border-radius:50%; border:1.5px solid rgba(37,31,33,.25); background:rgba(255,255,255,.4); display:none; pointer-events:none; }
  #knob { position:absolute; width:44px; height:44px; border-radius:50%; background:rgba(37,31,33,.55); left:33px; top:33px; }
  #picker { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(180deg,#dfe4e0,#f6ead6); padding:20px; overflow:auto; }
  #picker>b { font-size:26px; letter-spacing:.08em; }
  #picker>span { color:#585254; margin:6px 0 18px; }
  #pick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; width:min(760px,92vw); }
  .pick { border:1px solid rgba(37,31,33,.16); background:#fff; border-radius:12px; padding:14px 12px; font-size:14px; font-weight:600; cursor:pointer; text-align:left; }
  .pick:hover { border-color:#c76b1d; color:#c76b1d; }
  @media (max-width:760px){ #title{left:12px;right:12px;max-width:none} #hud{top:110px;right:12px;gap:8px;padding:6px 10px} #dbwrap{left:12px;bottom:64px;width:min(240px,52vw);padding:8px 10px} #povbar{left:12px;right:12px;bottom:12px;transform:none;display:flex;gap:5px;justify-content:center;padding:5px 6px} #povbar .btn{font-size:11px;padding:5px 7px;white-space:nowrap} #panel{left:12px;right:12px;bottom:160px;max-height:35vh} #qbadge{top:auto;bottom:118px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="card"><b id="title-b">WHAT IF?</b><span id="title-s"></span></div>
<div id="hud" class="card">
  <div class="r"><label id="r-time-l">Time</label><b id="r-time">-</b></div>
  <div class="r"><label id="r-stat-l">-</label><b id="r-stat">-</b></div>
  <div class="r"><label>POV</label><b id="r-pov">-</b></div>
</div>
<div id="dbwrap" class="card"><label id="dblabel">-</label><div id="dbbar"><div id="dbfill"></div></div><span id="dbval">-</span></div>
<div id="povbar" class="card"><button class="btn" id="ctl">Controls</button></div>
<div id="qbadge" class="card"></div>
<div id="panel" class="card">
  <h3>Experiment controls</h3>
  <button id="start" class="btn primary">Start countdown</button>
  <button id="slow" class="btn">Slow motion 0.1x</button>
  <button id="again" class="btn">Restart</button>
  <div id="sliders"></div>
  <div class="note" id="panel-note"></div>
  <div class="note" id="whatnot"></div>
</div>
<div id="results" class="card">
  <h2>Results</h2>
  <div class="sub">Educational estimate with illustrative values - not a measurement. Assumptions below.</div>
  <table id="res-rows"></table>
  <div id="res-notes"></div>
  <button id="close-res" class="btn primary">Got it</button>
</div>
<div id="center"><div id="count"></div></div>
<div id="stick"><div id="knob"></div></div>
<div id="picker"></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module" src="./engine.js"></script>
</body>
</html>
